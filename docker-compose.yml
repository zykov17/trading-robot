services:
  postgres:
    image: postgres:16
    container_name: trading-robot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trading_robot
      POSTGRES_USER: trading_robot
      POSTGRES_PASSWORD: trading_robot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_robot -d trading_robot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: